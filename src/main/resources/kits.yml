
# ===================================
# Configuración de kits de Rankshop
# ===================================

# Formato:
# ID:META:CANTIDAD
# ID:META:CANTIDAD:NOMBRE
# ID:META:CANTIDAD:NOMBRE:ENCANTAMIENTO:NIVEL
# ID:META:CANTIDAD:NOMBRE:ENCANTAMIENTO:NIVEL:ENCANTAMIENTO:NIVEL
#
# Usa "default" en lugar del nombre para conservar el nombre normal.
# Puedes utilizar & para los colores del nombre.
#
# Ejemplo:
# "276:0:1:&dEspada VIP:9:3:13:2"
#
# Los IDs de los encantamientos deben existir en tu versión de Nukkit.

vip:
  name: "Kit VIP"
  cooldown-seconds: 86400
  items:
    - "276:0:1:&dEspada VIP:9:3:13:2"
    - "278:0:1:&bPico VIP:15:3:17:2"
