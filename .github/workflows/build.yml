name: Build RankshopUIV2

on:
  push:
    branches:
      - main
      - feature/economyexpandnk-multicurrency
    paths:
      - 'src/**'
      - 'libs/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'libs/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build plugin
        run: ./gradlew --no-daemon clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: RankshopUIV2-1.2.0
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
